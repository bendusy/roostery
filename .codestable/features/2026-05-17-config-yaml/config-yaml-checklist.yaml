feature: 2026-05-17-config-yaml
created: 2026-05-17

steps:
  - action: "paths 扩 + Cargo.toml + lib.rs + config.rs 骨架：paths::config_path() 返 ~/.roostery/config.yaml；Cargo.toml 加 serde_yml = \"0.0.12\"；lib.rs pub mod config;；新建 src/config.rs 仅含占位 + 6 字段 Config struct 声明 + impl Default"
    exit_signal: "cargo build 成功；paths::config_path 单测；既有 testsuite 无回归"
    status: done

  - action: "schema 强类型化 + #[serde(default)] + ConfigError：完整 Config / Identity / Budgets / BudgetCfg / TraceConfig / JournalConfig 各 #[non_exhaustive] + impl Default（max_calls=100 / max_cost_usd=1.0 / max_depth=8 / rotation=\"daily\" / JournalConfig.dir 默认 paths::journal_dir() 调用时刻快照）；ConfigError 4 变体（LoadFailed / ParseFailed / SaveFailed / SchemaVersionMismatch）#[non_exhaustive]；SCHEMA_VERSION_CURRENT=1"
    exit_signal: "Config::default() 单测；YAML \"\" → Config::default() 反序列化单测；完整 YAML round-trip 单测；schema 子 struct round-trip 单测"
    status: done

  - action: "load / load_from + schema_version 校验：两个 load fn；缺失文件 → Ok(Config::default())；缺失 schema_version → 视为 1；schema_version != 1 → SchemaVersionMismatch；parse 失败 → ParseFailed；IO 失败 → LoadFailed"
    exit_signal: "load 5 路径单测全过（missing file / valid / parse fail / IO error / schema mismatch）"
    status: done

  - action: "save / save_to + atomic write：两个 save fn；ensure parent dir；serde_yml::to_string → 写 .tmp → std::fs::rename"
    exit_signal: "save 4 单测全过（round-trip / default round-trip / parent dir 自动创建 / .tmp 不残留）"
    status: done

  - action: "runners 开放结构 + 集成测试：BTreeMap<String, serde_yml::Value> 验证任意 runner 子键反序列化；写 ≥ 1 集成测试（tests/config_integration.rs 用完整 YAML 文件覆盖 save → load round-trip + ROOSTERY_HOME env override 联动 paths::config_path）"
    exit_signal: "runners 多键混合 YAML 反序列化单测；集成测试通过；cargo test --all 全绿"
    status: done

  - action: "完整验收 + CI：cargo test --all + cargo test --doc + cargo clippy --all-targets --all-features -- -D warnings + cargo fmt --all --check 四命令全绿；推 CI 验三 job"
    exit_signal: "本地四命令全绿；远端 CI 全绿"
    status: done

