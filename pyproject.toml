[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roostery"
version = "0.0.0"
description = "🪺 Vendor-neutral agent broker, Feishu-native. 飞书原生的多 Agent 中立接入器。"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ben Dusy", email = "ben@bendusy.dev" }
]
keywords = ["agent", "feishu", "lark", "multi-agent", "vendor-neutral", "local-first", "openclaw", "claude-code", "agent-broker"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/bendusy/roostery"
Repository = "https://github.com/bendusy/roostery"
Issues = "https://github.com/bendusy/roostery/issues"

[tool.setuptools.packages.find]
where = ["src"]
