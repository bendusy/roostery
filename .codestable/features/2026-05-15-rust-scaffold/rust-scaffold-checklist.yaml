feature: 2026-05-15-rust-scaffold
created: 2026-05-15

steps:
  - action: "文件搬运 + archive commit：建 legacy/python/，git mv src/roostery + tests + examples + scripts 进 legacy/python/，删 index.js + dist/ + .pytest_cache/ + package.json + pyproject.toml，写 legacy/python/README.md，独立提交"
    exit_signal: "ls 根目录无 Python/JS 入口文件；ls legacy/python/src/roostery/ 列出 21+ .py 文件；git status 干净；git log -1 是 archive commit"
    status: done

  - action: "Rust 工作台建立：写 workspace 根 Cargo.toml + rust-toolchain.toml；建 crates/roostery/Cargo.toml + src/main.rs + src/lib.rs"
    exit_signal: "cargo build 成功 0 warning；cargo run -- --version 输出 'roostery 0.0.0 (rust)'；cargo test --all 输出 '0 passed; 0 failed'"
    status: done

  - action: ".gitignore 加 Rust artifact（target/、**/*.rs.bk）"
    exit_signal: "cat .gitignore 含 target/"
    status: done

  - action: "写 .github/workflows/ci.yml（fmt / clippy / test 三 job，ubuntu-latest）"
    exit_signal: "本地 cargo fmt --all --check + cargo clippy --all-targets --all-features -- -D warnings + cargo test --all 三命令全绿"
    status: done

  - action: "文档同步：README.md 加 Rust 期 notice；CLAUDE.md 切换为 Rust 期叙述（commands 改 cargo，模块路径指向 crates/roostery/，Python 内容指向 legacy/python/）；ARCHITECTURE.md 模块映射改为 Rust 路径"
    exit_signal: "grep -rE 'src/roostery/|pip install|pytest' CLAUDE.md README.md .codestable/architecture/ARCHITECTURE.md 仅在 legacy/historical 语境出现；head -5 README.md 含 'Rust 重写中' 类似 notice"
    status: done

  - action: "本地预跑 + scaffold commit + 推 CI 验证"
    exit_signal: "本地 fmt/clippy/test 全绿；推 commit 到 main 或建 PR 后 GitHub Actions fmt/clippy/test 三 job 全绿"
    status: done

