    notes: "Phase 0；完成后 cargo run -- --version 输出 roostery 0.0.0 (rust)；删 pyproject.toml / index.js / package.json（npm + PyPI namespace 已 reserved 不依赖本地 manifest）。Accepted 2026-05-15（commit 511dce3，CI run #25912520438）"

  - slug: core-redact
    description: redact 模块，敏感字段脱敏；纯函数无 I/O
    depends_on: [rust-scaffold]
    status: done
    feature: 2026-05-15-core-redact
    minimal_loop: false
    notes: "Phase 1；Python 版作 reference，行为以接口契约 + portable-by-default 边界为准；SENSITIVE_KEYS 11 个（Python 7 + 扩展 4：password/secret/cookie/private_key）。Accepted 2026-05-15（commit 1e392e5，CI run #25914996799）"

  - slug: core-remoterefs
    description: remoterefs 模块，JSON walk + match-dispatch 从 lark-cli stdout 抽 9 个 newtype token
    depends_on: [rust-scaffold]
    status: done
    feature: 2026-05-16-core-remoterefs
    minimal_loop: false
    notes: "Phase 1；Python 版 reference"

  - slug: journal-core
    description: Journal 模块 + JournalEntry schema（§4.2）首次落地，schema_version=1 对外承诺
    depends_on: [rust-scaffold, core-redact]
    status: done
    feature: 2026-05-15-journal-core
    minimal_loop: false
    notes: "Phase 1；portable-by-default req 核心契约载体；schema 重新设计不继承 Python 版 jsonl"

  - slug: lark-cli-wrapper
    description: LarkRunner trait（§4.1，已升级 rich enum + thiserror）+ LarkCli subprocess + MockLarkRunner + Journaled<R> 装饰器
    depends_on: [rust-scaffold, journal-core]
    status: done
    feature: 2026-05-16-lark-cli-wrapper
    minimal_loop: false
    notes: "Phase 2；下游所有飞书操作必经此 trait"

  - slug: roostery-smoke
    description: roostery smoke 子命令，跑 6 个 probe 验证矩阵（im / docs / drive）
    depends_on: [lark-cli-wrapper]
    status: done
    feature: 2026-05-17-roostery-smoke
    minimal_loop: false
    notes: "Phase 2；probe 命令矩阵以 lark-cli 1.0.28 schema 为准；本机 2026-05-17 实测 1.0.29 同样兼容；引 clap 4 derive 作为项目首个 CLI 解析器；smoke 不走 LarkRunner trait（raw bytes vs buffered Value 同 shim 决定）；公开 ensure_ready() -> Result<(), SmokeError> 给 init / daily_report 当升级 gate"

  - slug: lark-cli-shim
    description: bin/shim 独立二进制，PATH-prefix shim 透传真 lark-cli 并写 journal
    depends_on: [lark-cli-wrapper, journal-core]
    status: done
    feature: 2026-05-17-lark-cli-shim
    minimal_loop: false
    notes: "Phase 2；shim 是 ~/.local/bin/lark-cli 装机点，agent runtime 调 lark-cli 必经；streaming bytes 模型（std::thread + std::process）与 LarkRunner buffered Value 模型独立"

  - slug: config-yaml
    description: Config schema（§4.6）读写 + 默认值 + schema_version 升级路径
    depends_on: [rust-scaffold]
    status: done
    feature: 2026-05-17-config-yaml
    minimal_loop: false
    notes: "Phase 3；schema 重新设计；Python 版 ~/.feishu_hub/config.yaml 迁移不在范围；YAML 库走 serde_yml 0.0.12（serde_yaml maintained fork）；runners 字段开放结构 BTreeMap<String, serde_yml::Value>，runner 强类型化推迟到 Phase 4 dispatcher-runners；env override 由各模块自管不在 config 层；4 公开 fn load/load_from/save/save_to + atomic .tmp+rename；schema_version 缺失=1 / =1 OK / !=1 SchemaVersionMismatch"

  - slug: hooks-merge
    description: JSON 深合并，CC / Codex Stop hook 注入 ~/.claude/settings.json / ~/.codex/hooks.json
    depends_on: [config-yaml]
    status: done
    feature: 2026-05-18-hooks-merge
    minimal_loop: false
    notes: "Phase 3；Python 版输出做 golden file，Rust 版 byte-for-byte 一致（除非文档另有规定）；env 前缀切到 ROOSTERY_AGENT=cc/codex（不沿用 FEISHU_HUB_AGENT，文档明示偏离）；模板 include_str! 嵌入 cc_stop_hook.json + codex_stop_hook.json + agent_stop_notify.sh 三文件；sh 调 roostery dispatcher fire 形态，Phase 4 dispatcher 起来后正常工作；3 公开 fn render_template/merge_event_hook/apply_template；按 event key+matcher+command tail 三层幂等去重；JSON 输出 indent=2+\\n；项目首次引入 src/templates/ 资源文件子目录模式（拟扩 rust-module-organization decision 第 5 档）"

  - slug: roostery-init
    description: roostery init 子命令 + identity / agent_detect / 模板嵌入（§4.7）
    depends_on: [hooks-merge, lark-cli-shim]
    status: done
    feature: 2026-05-18-roostery-init
    minimal_loop: false
    notes: "Phase 3；完成后陌生开发者第一次能跑通装机链路；尚不能 E2E 出 task"

  - slug: dispatcher-trace-budget
    description: Trace（§4.5）+ Budget gate 模块；持久化 ~/.roostery/state/budget.json
    depends_on: [rust-scaffold, journal-core, config-yaml]
    status: done
    feature: 2026-05-18-dispatcher-trace-budget
    minimal_loop: false
    notes: "Phase 4；loop 保护是中立 dispatcher 的前提"

  - slug: dispatcher-rules
    description: Rules 模块 + YAML 规则反序列化 + 匹配逻辑
    depends_on: [dispatcher-trace-budget]
    status: done
    feature: 2026-05-18-dispatcher-rules
    minimal_loop: false
    notes: "Phase 4；rule schema 重新设计"

  - slug: dispatcher-runners
    description: Runner trait（§4.3）+ cc_headless / codex_exec / gemini_headless / noop 默认实现 + runner_registry
    depends_on: [dispatcher-trace-budget, lark-cli-wrapper]
    status: done
    feature: 2026-05-18-dispatcher-runners
    minimal_loop: false
    notes: "Phase 4；首发实际落地 = noop + cc_headless（codex_exec / gemini_headless 完全不出现，推后到真有需求时新增 feature 加 impl，runtime-neutral req 允许）。**与 §4.3 偏离**（user 拍板）：(a) Runner::run 不收 &BudgetGate 参数（budget gate 编排留给 dispatcher-loop）；(b) RunOutcome 加 cost_usd: Option<f64> 字段。建议后续 cs-roadmap update 把 §4.3 原契约改齐。Accepted 2026-05-18（commit 1716a38，CI run f56a20c）"

  - slug: dispatcher-loop
    description: Loop + Event bridge + roostery dispatcher 子命令（fire / replay / test-rule）
    depends_on: [dispatcher-rules, dispatcher-runners]
    status: done
    feature: 2026-05-18-dispatcher-loop
    minimal_loop: false
    notes: "Phase 4 收尾 / Module E 整体完成。Design 关键决策（user 拍板 2026-05-18）：(a) replay = live-replay 真跑 runner + 分配新 trace_id + journal trigger_meta.replay_of 关联源；(b) emitted_events 本期消费走自触发链式分发（BFS 队列 + trace.max_depth + DEFAULT_MAX_FANOUT=16 双守门）；(c) fire 始终 exit 0 + journal 落档；(d) rules 命中但 runner kind 不在 registry → StepStatus::Skipped。0 新增 Cargo dep。Accepted 2026-05-18（commit 7fd07fc，CI run a7d23e5 / #26018196490 全绿）"

  - slug: bot-task-writer
    description: Task writer 创建 Feishu task + append step stream + session cache
    depends_on: [lark-cli-wrapper, journal-core, config-yaml]
    status: done
    feature: 2026-05-18-bot-task-writer
    minimal_loop: false
    notes: "Phase 5 Module F 第 1 子 feature；session cache 本地 schema 重新设计 schema_version=1 不继承 Python 版。Design 关键决策（user 拍板 2026-05-18）：(a) 纯库 API 3 pub fn（create_task / append_steps / get_or_create_for_session），不挂 dispatcher registry；(b) host suffix 保留（ROOSTERY_HOST env > hostname 首段，Python parity）；(c) 部分失败 Ok(TaskRef) + 独立 log；(d) append_steps --yes 架构红线显式破例已进 ARCHITECTURE §6 第 18 条归档；(e) assignee None 走 identity::current 失败返 Err。首次让 Rust 业务模块真消费 LarkRunner trait 做生产飞书 IO。0 新增 Cargo dep。顺手 fix（不是本 feature 范畴但触发暴露）：onboarding shell_kind_detect_* 4 测试加 ENV_LOCK 串行化（attention.md 规约）。Accepted 2026-05-18（commit 083b8ba，CI run #26021247942 全绿）"

  - slug: bot-stop-hook
    description: Stop hook 入口 + 反向调用 CLI；双 CLI surface 共享 bot::push 核心 lib fn；任意 agent / 脚本可推送到飞书
    depends_on: [bot-task-writer, dispatcher-loop, roostery-init]
    status: done
    feature: 2026-05-18-bot-stop-hook
    minimal_loop: true
    notes: "Phase 5 Module F 第 2 子 feature = **minimal-loop closing = 0.1.0 release 触发判据达成**。Accepted 2026-05-18（commit 220c7b0，CI run #26030808131 三 job 全绿，420 tests 全过）。**双 CLI surface 共享 bot_stop_hook::push 核心**：(1) roostery bot stop-hook（被动 hook stdin JSON，Rust 端原生 transcript jsonl tail）；(2) roostery bot push（反向调用 flag/stdin，让任意 agent / 脚本 / cron / CI 主动推飞书）。Design 关键决策（user 拍板 2026-05-18）：(a) Rust 红利显式发挥 — 类型化 PushRequest builder + PushOutcome 结构化 --json 输出（v1 稳定契约） + --strict opt-in 真实 exit code + blake3 稳态 idempotency key + structured tracing；(b) receive_id 三层链 env ROOSTERY_NOTIFY_TO > identity::current > config.identity.user_id（不引入 notify_receive_id 新字段）；(c) summary 抽取在 Rust 层；agent_stop_notify.sh 47行→10行极简 wrapper；(d) 不调 dispatcher fire — push 与 dispatcher 两条独立顶层入口；(e) 主流程错误分类 LarkCallFailed 与其他都走 IM 兜底（--no-im-fallback opt-out）；(f) main.rs 仅顶层 dispatch — Bot args + run 放 bot_stop_hook::cli 模块（建议沉淀 convention，待 cs-decide 归档）；(g) 附带 S10.5 修：4 mod ENV_LOCK 各自独立 Mutex 跨模块 race（race 在多 mod 同时改 ROOSTERY_HOME 时），统一切到 crate::paths::TEST_ENV_LOCK 共享锁，attention.md 同步修订规约。新增 dep：blake3。req agent-work-in-feishu 此刻升级 draft → current"

  - slug: bot-bridge-cluster
    description: bot_role / bot_runner / bot_bridge / bot_relay_task / hitl_router 合并实现
    depends_on: [bot-stop-hook]
    status: done
    feature: 2026-05-19-bot-bridge-cluster
    minimal_loop: false
    notes: "Phase 5 Module F 第 3 子 feature。Rust 期 1 子目录 bot_bridge/ 9 文件（含 mod.rs + cli.rs）替代 Python 5 模块。关键决策（design D1-D12 user approved 2026-05-19）：(a) 5 Python 模块合并 1 Rust 子目录按职责切分；(b) HITL 信号通道走进程内 tokio oneshot channel 不落盘 sentinel（Rust 期重新设计代表案例）；(c) runner 调用走 dispatcher::runners::Runner trait + Registry 复用 Phase 4；(d) IM 事件源走 lark-cli im_messages_subscribe 子进程 NDJSON tail + 指数退避重连 cap 60s；(e) ActiveRunnerRegistry 命名避让 dispatcher::runners::RunnerRegistry；(f) ADJUST_MAX=1 const Python parity；(g) 每 BotRole 独立 cache 目录 ~/.roostery/state/bot_chats/{app_id}/。Accepted 2026-05-19（commits 3ccd2a3..dbd2470，570 tests 全过，clippy/fmt 全绿）。明确不做：base_intent_router / --parallel flag / cleanup_orphans / 用户自定义 abort-adjust 关键词 / relay_writer_app_id 跨身份 profile 转向 / POSIX os::kill。req agent-work-in-feishu 兑现用户故事第 4 条（团队成员围观 / 点评 / 接续 IM 群里反向操控 agent）。"

  - slug: report-recap-engine
    description: git_log 多仓聚合 + roostery daily-recap 子命令 + 直接调 RunnerRegistry::find(kind).run 委托用户已装 agent CLI；复用 §4.3 Runner trait 但不走 dispatcher::fire；自管 BudgetGuard + JournalEntry；Roostery 不直连 LLM
    depends_on: [rust-scaffold, dispatcher-runners, dispatcher-trace-budget, journal-core, core-redact, config-yaml]
    status: done
    feature: 2026-05-19-report-recap-engine
    minimal_loop: false
    notes: "Phase 6；Cargo feature daily-report 默认开；--no-default-features 剥的是子命令注册 + module 编译（reqwest 整个不被 Roostery 引）；不走 dispatcher::fire（hook-event 分发 vs one-shot string-return 语义不同，详见 design §0 D5 + codex review 留痕）。原 slug report-git-llm 于 2026-05-19 改名。Accepted 2026-05-19——4 轮 codex review + 5 个 design 版本（v1→v5）；落地 crates/roostery/src/daily_recap/ + tests/daily_recap_integration.rs；533 lib tests + 8 integration tests + clippy 双 build mode 全绿；ARCHITECTURE.md §3 Module G + §5.5 + §5.10 (新增) + §6.3 三处归并；attention.md 加 git log exit 128 quirk 一条；req daily-dev-recap 保 draft（待 report-daily 落地后升 current）"

