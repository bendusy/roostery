    exit_signal: "cargo build 成功；HookEvent serde round-trip 单测；HOOK_EVENT_SCHEMA_VERSION const 单测；trigger_meta_path 命中 / 缺路径 / 非 object 中断 3 单测"
    status: done

  - action: "S2 rules 类型骨架：新建 src/rules.rs 含 RuleName(String) #[serde(transparent)] newtype + RawRule / RuleWhen / RuleAction / CompiledRule / Match<'a> 类型；RulesError #[non_exhaustive] 5 变体（LoadFailed/ParseFailed/SchemaVersionMismatch/DuplicateRuleName/InvalidGlob）；fn 签名 todo!()；RULES_SCHEMA_VERSION=1 const + SELF_EVENT_PREFIXES &[&'static str] const"
    exit_signal: "cargo build 成功；RuleName transparent serde 单测；RulesError display 单测；const 暴露单测"
    status: done

  - action: "S3 YAML load + compile：load / load_from 实装走 serde_yml 反序列化 RulesConfig；校验 schema_version == 1；重名 grep；逐条 compile_rule 把 workspace_glob 字符串编译为 globset::GlobMatcher；paths.rs 加 rules_path()；Cargo.toml 加 globset 0.4"
    exit_signal: "load 6 单测：文件缺失 Ok(vec![]) / yaml 非法 ParseFailed / schema_version=2 SchemaVersionMismatch / 重名 DuplicateRuleName / 非法 glob InvalidGlob / 2 规则 happy 编译完成"
    status: done

  - action: "S4 matches 实装：self-event 短路（hook_source starts_with SELF_EVENT_PREFIXES）+ 遍历 CompiledRule 逐条 AND 维度判定（hook_source eq / workspace glob.is_match / trigger_meta_eq 所有 key 路径 eq）+ first-match-wins 返 Option<Match<'a>>"
    exit_signal: "matches 11 单测：空规则集 None / self-event dispatcher 短路 / self-event roostery 短路 / hook_source 命中 / hook_source 不命中跳过 / workspace_glob ** 通配命中 / trigger_meta_eq 命中 / trigger_meta path 缺失不命中 / AND 全过 / AND 部分过失败 / first-match-wins 仅返第一"
    status: done

  - action: "S5 模块挂载 + 集成测试：lib.rs 加 pub mod hook_event / rules；新建 tests/rules_integration.rs 串场景（rules.yaml 真磁盘 load → matches real HookEvent → assert Match.runner/args）"
    exit_signal: "lib.rs 2 mod 暴露；集成测试 3+ 全绿；既有 testsuite 无回归"
    status: done

  - action: "S6 完整验收 + 守护 grep + CI：cargo test --all + cargo test --doc + cargo clippy --all-targets --all-features -- -D warnings + cargo fmt --all --check 四命令本地全绿；N1-N10 + as_object_mut.unwrap 守护 grep 0 命中；推 CI 验三 job"
    exit_signal: "本地四命令全绿；远端 CI 全绿；守护 grep 表全 0 命中"
    status: done

