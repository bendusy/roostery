    description: 删 legacy/python/、重写 README（leading with user-why）、更新 CLAUDE.md、Cargo.toml crates.io 元信息、GitHub Actions release workflow
    depends_on: [bot-bridge-cluster, report-daily, base-indexer]
    status: planned
    feature: null
