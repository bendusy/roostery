    status: done

  - action: "S2 计算层纯函数 + transcript_reader inline mod：truncate_utf8 (floor_char_boundary 多字节安全) + cwd_basename (Path 提取最后段) + stable_idem_key (blake3 8-char hex) + resolve_summary_from_hook_input (transcript > prompt_response > None 链) + inline mod transcript_reader { read_last_assistant_text(path, max_bytes) + TranscriptReadError (NotFound/Io/NoAssistantMessage) }"
    exit_signal: "7 单测（transcript happy / 大文件 10MB tail 仅块读 / 无 assistant 返 Err / NotFound / truncate UTF-8 边界含 emoji / idem key 同输入稳态 / basename 各种 path 含 trailing slash）；Cargo.toml 加 blake3 dep"
    status: done

  - action: "S3 receive_id 三层链 helper：async fn resolve_receive_id(runner, explicit_assignee: Option<&str>) -> Option<String>；优先 explicit_assignee > env ROOSTERY_NOTIFY_TO > identity::current(runner).await?.user_open_id > Config::load()?.identity.user_id（非空时取）；任一层失败不当 fatal 走下一层"
    exit_signal: "5 单测（explicit 直返 / env 命中跳过 identity / identity 命中 / config 兜底 / 全空返 None）"
    status: done

  - action: "S4 push 核心 lib fn：pub async fn push(req, runner, opts) -> PushOutcome；编排 resolve_receive_id → if None 返 Skipped → task_writer.get_or_create_for_session → task_writer.append_steps → 成功返 Success / 任意错按 no_im_fallback flag 决定走 IM 兜底（lark-cli im +messages-send）或直接 Failed；IM 兜底成功返 FallbackUsed / 失败返 Failed；outcome.errors 累积人类可读错误摘要"
    exit_signal: "MockLarkRunner 集成单测 8 条（happy / explicit assignee 跳层 / receive_id 全空 Skipped / task fail → IM 兜底 FallbackUsed / task + IM 双失败 Failed / no_im_fallback 时 task fail 直接 Failed / append_steps 失败也走 IM / Skipped 时不调任何 lark-cli）"
    status: done

  - action: "S5 stop-hook CLI 适配：pub async fn run_stop_hook(runner, opts) -> PushOutcome；read_stdin_json::<StopHookInput>（失败 outcome.status=Failed + errors push parse 错误，不 panic）→ agent = env ROOSTERY_AGENT or 'unknown' → resolve_summary（含 transcript_reader 调用）→ cwd = input.cwd or env::current_dir → session = input.session_id or 'no-session' → 构造 PushRequest → 调 push fn"
    exit_signal: "4 单测（CC happy stdin / 空 stdin 全 default / transcript NotFound 退回 prompt_response / stdin 非法 JSON outcome.Failed 不 panic）"
    status: done

  - action: "S6 push CLI 适配 + clap args：BotSub::Push(PushCliArgs)；PushCliArgs (clap derive): --agent / --session required, --cwd / --summary / --description / --assignee-open-id optional, --summary-stdin bool, --strict / --json / --no-im-fallback bool；ArgGroup summary 互斥 (--summary vs --summary-stdin)；pub async fn run_push(args, runner, opts) -> PushOutcome；从 args 构造 PushRequest 调 push fn"
    exit_signal: "5 单测（flag-based happy / --summary-stdin 读 stdin / 互斥校验 clap 报错 / --description 透传 / --assignee-open-id 透传）"
    status: done

  - action: "S7 main.rs 接线：Command 枚举加 Bot(BotArgs) 变体；BotArgs { subcmd: BotSub } 在 bot_stop_hook::cli 模块（不塞 main.rs）；main.rs 仅一行 dispatch Command::Bot(a) => bot_stop_hook::cli::run(a)；tokio rt + Journaled<LarkCli> runner 注入；--json 时 outcome 序列化到 stdout / 默认空 stdout；--strict 时 outcome.status=Failed → exit 1 / 其他 exit 0；lib.rs 加 pub mod bot_stop_hook"
    exit_signal: "cargo build 全绿；cargo run -- bot stop-hook --help 显示文档；cargo run -- bot push --help 显示文档；clap dispatch 接通"
    status: done

  - action: "S8 CLI 集成测试：新建 tests/bot_cli_integration.rs；assert_cmd 跑真 binary + PATH 注入 mock lark-cli 脚本 + ROOSTERY_HOME tempdir 隔离；4 条 e2e（stop-hook stdin + push flag + push --summary-stdin --json 解析 / push --strict task fail exit 1）"
    exit_signal: "cargo test --test bot_cli_integration 全绿"
    status: done

  - action: "S9 模板替换 + onboarding golden：crates/roostery/src/templates/agent_stop_notify.sh 改为 '#!/usr/bin/env bash\\nset -u\\nROOSTERY_AGENT=${ROOSTERY_AGENT:-cc} exec roostery bot stop-hook'；include_str! 自动重读；onboarding::install_templates golden test 更新（仅 sh 内容字节）"
    exit_signal: "cargo test onboarding::install_templates 全绿；模板内容 <5 行 + 无 jq/tail/extract"
    status: done

  - action: "S10.5 测试 ENV_LOCK 跨模块 race 修复（implement 阶段反射检查触发，user 拍板 2026-05-18）：paths.rs 提 pub(crate) static TEST_ENV_LOCK: Mutex<()>（不上 cfg(test) 以跨模块共享）；paths/bot_task_writer/onboarding/bot_stop_hook tests mod 都换用 crate::paths::TEST_ENV_LOCK；attention.md 顺手补一条 测试 env 串行化必须用 crate-wide 共享 Mutex 的修订（覆盖原 各模块自有 ENV_LOCK 模式）。只搬不改行为：编译绿灯 + 测试断言不变。"
    exit_signal: "cargo test --all 并行模式全绿（不需 --test-threads=1）；attention.md '测试' 节加一条共享 Mutex 修订"
    status: done

  - action: "S10 完整验收 + 守护 grep + CI：cargo test --all + cargo test --doc + cargo clippy --all-targets --all-features -- -D warnings + cargo fmt --all --check 四命令本地全绿；N1-N3 (no dispatcher fire / no reqwest / no notify_receive_id 新字段) + idiom grep (blake3 ≥1 处) 全 0 命中；推 CI 验三 job"
    exit_signal: "本地四命令全绿；远端 CI 全绿；守护 grep 表全 0 命中（除应有的 blake3）"
    status: done

