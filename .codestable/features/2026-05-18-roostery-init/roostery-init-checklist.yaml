  - action: "S6 onboarding 持久化层实装：install_shim（current_exe sibling + hash 比对 sha2 + 0755 chmod）/ write_sh_bridge / write_env_file（含 export ROOSTERY_REAL_LARK_CLI=resolved-path）/ patch_shell_rc（marker block # >>> roostery >>> / # <<< roostery <<< 包裹幂等）；smoke::ensure_ready() 守门 + 失败即返"
