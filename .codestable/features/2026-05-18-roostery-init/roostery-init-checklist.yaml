    status: done

  - action: "S9 完整验收 + 守护 grep + CI：cargo test --all + cargo test --doc + cargo clippy --all-targets --all-features -- -D warnings + cargo fmt --all --check 四命令本地全绿；rust-idiom-first 守护 grep（as_object_mut.unwrap / FEISHU_HUB_ / cargo install / fish / uninstall）逐条 0 命中；推 CI 验三 job"
    exit_signal: "本地四命令全绿；远端 CI 全绿；守护 grep 表 5 条全 0 命中"
    status: done

