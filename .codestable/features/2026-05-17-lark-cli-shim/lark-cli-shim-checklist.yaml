feature: 2026-05-17-lark-cli-shim
created: 2026-05-17

steps:
  - action: "bin target + 骨架：建 crates/roostery/src/bin/shim.rs 含 fn main() -> ExitCode { ExitCode::SUCCESS } 占位；Cargo.toml 加 [[bin]] name = \"shim\" path = \"src/bin/shim.rs\""
    exit_signal: "cargo build --bin shim 成功；./target/debug/shim 跑通退 0；cargo test --all 仍跑通既有 106 lib 测试无回归"
    status: done

  - action: "ShimError 4 变体 + resolve_real_cli + anti-recursion + 类型骨架：声明 ShimError thiserror enum + 常量 (ENV_REAL_CLI / ENV_NOJOURNAL / INTERACTIVE_VERBS / STDOUT_HEAD_CAP / STDERR_HEAD_CAP) + resolve_real_cli 实现 (env 读 + canonicalize + 比对 current_exe) + 其他 fn 签名 todo!()"
    exit_signal: "resolve_real_cli 4 错误路径单测（MissingRealCli / Recursion / RealCliNotFound / happy）通过"
    status: done

  - action: "is_interactive 三段式 + Outcome enum + build_entry 两形态：is_interactive 检 IsTerminal + INTERACTIVE_VERBS + flag 三层；Outcome::Full | Outcome::Skipped；build_entry 构造 JournalEntry 11 字段映射（source=shim / action=lark-cli:{argv[0]}[:skipped] / params 含 argv+cwd+stdin_present+stdout_head+stderr_head+remote_refs / result Ok|Err / duration_ms）"
    exit_signal: "is_interactive truth table（TTY / verb / flag / 都不命中）单测 + build_entry schema 锁定单测（11 字段全在 + result Ok 含 remote_refs Value）"
    status: done

  - action: "run_non_interactive 流式 pump：std::process::Command + 2 std::thread::spawn（stdout/stderr 各一个）+ head buffer cap + broken-pipe tolerant（let _ = dst.write_all）；返回 (rc, stdout_head, stderr_head, duration_ms)"
    exit_signal: "用伪 binary fixture（同 lark_cli/subprocess 模式）跑 happy + exit code 透传 + head cap (200 KiB 输出验 head 仅 64 KiB) + 4 case 全过"
    status: done

  - action: "main 整合 + 集成测试：main 把所有片段串起来（resolve_real_cli → is_interactive 分支 → NOJOURNAL 分支 → run_non_interactive → build_entry → journal.append → tracing::warn on fail）；新建 crates/roostery/tests/shim_integration.rs 含 2 集成测试（非交互写完整 entry + NOJOURNAL 写 skipped entry）"
    exit_signal: "集成测试全过；本地 cargo test --all 全绿"
    status: done

  - action: "完整验收 + CI：cargo test --all + cargo test --doc + cargo clippy --all-targets --all-features -- -D warnings + cargo fmt --all --check 四命令全绿；推 CI 验三 job"
    exit_signal: "本地四命令全绿；远端 CI 全绿"
    status: done

