feature: 2026-05-16-core-remoterefs
created: 2026-05-16

steps:
  - action: "模块骨架 + 9 newtype + RemoteRefs：建 crates/roostery/src/remoterefs.rs；声明 9 个 unit struct (MessageId / DocToken / FolderToken / RecordId / ChatId / AppToken / WikiToken / TaskId / ThreadId) 全部 #[serde(transparent)] + derive (Serialize/Deserialize/Debug/Clone/PartialEq/Eq) 无 Hash；RemoteRefs struct 9 字段 #[non_exhaustive] + skip_serializing_if + Default；extract 签名 todo!()；lib.rs 加 pub mod remoterefs;"
    exit_signal: "cargo build 成功；9 newtype 可独立构造；RemoteRefs::default() 可调；serialize 全 None RemoteRefs 输出 {}；serialize Some(MessageId(\"om_x\".into())) 输出裸 \"om_x\"（transparent 验证）"
    status: done

  - action: "每 newtype 加 AsRef<str> + fmt::Display impl：用 macro_rules! 批量生成 9 个对称实现避免 18 块样板"
    exit_signal: "MessageId(\"x\".into()).as_ref() == \"x\"；format!(\"{}\", MessageId(\"x\".into())) == \"x\"；其余 8 个对称测试通过"
    status: done

  - action: "as_token helper + walk 函数骨架（含 depth 参数 + MAX_DEPTH=64）：实现私有 as_token(&Value) -> Option<String> 过滤空字符串；walk(&Value, depth: u32, bool, &mut RemoteRefs) 框架，depth > MAX_DEPTH 直接 return"
    exit_signal: "cargo build 成功；walk 跑通 Object/Array 递归不 panic（占位测试）"
    status: done

  - action: "walk 主体 + extract 主路径：填 walk 的 10 个 match 分支（9 字段 + folder_token 的 token-on-create-folder 条件分支）；每分支 is_none() guard 显式首匹配赢；extract 计算 argv_create_folder bool flag + stdout 短路逻辑（trim 空 / 首字符非 {[/ from_str fail 都返 Default）+ depth=0 起调 walk"
    exit_signal: "所有 happy（S1.1-S1.13 13 字段+alias）+ 嵌套 + Array + argv 消歧 + 错误兜底 case 通过"
    status: done

  - action: "类型隔离 compile_fail doctest + serialize roundtrip + sibling 顺序 + depth 限制测试：(a) compile_fail,E0308 doctest 证明 MessageId 不能传给 &DocToken 签名；(b) compile_fail,E0063 doctest 证明 RemoteRefs struct literal 缺字段且无 ..Default::default() 编译失败；(c) serialize roundtrip 证 transparent 形态稳定；(d) sibling-key 字典序断言（{\"b\":...,\"a\":...} 取 \"a\" 的值）；(e) doc_token 三 alias 同时出现取字典序首位；(f) 100 层深嵌套不 panic，浅层（<64）字段抽到，深层（>64）抽不到"
    exit_signal: "所有验收场景 S2.5/S2.6/S3.2/S4.1/S5.1-S5.6 测试通过；cargo test --doc 全绿"
    status: done

  - action: "集成验证：cargo test --all + cargo test --doc + cargo clippy --all-targets --all-features -- -D warnings + cargo fmt --all --check 四命令全绿；推 CI"
    exit_signal: "本地四命令全绿；推 commit 后 GitHub Actions fmt/clippy/test 三 job 全绿"
    status: done

