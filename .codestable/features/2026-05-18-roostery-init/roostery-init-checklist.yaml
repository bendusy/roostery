  - action: "S7 onboarding hook 编排：merge_hooks_for 遍历 detect 结果 + skip_agents，逐 agent 调 hooks_merge::apply_template；单 agent 失败不阻塞，errors 汇总到 InitReport；末尾若任一失败整体 exit 1"
    exit_signal: "集成测试 tests/onboarding_integration.rs：tempdir HOME + MockLarkRunner + fake PATH 三 agent 全装跑通；二次跑幂等；--skip-agent codex 跳过 codex 验证；某 agent target 是无效 JSON 时其他 agent 仍装且 InitReport.errors 非空"
    status: done

  - action: "S8 main.rs 接线：Command::Init(InitArgs)；InitArgs 含 --dry-run + --skip-agent <AGENT>（可重复）；解析 String → AgentKind 走 FromStr；handler 起 tokio::runtime::Builder::new_current_thread() 跑 onboarding::run；format_report 打印多行 summary（identity describe / 装了哪些 agent / shim 路径 / rc 改了哪个 / next-step 提示）"
