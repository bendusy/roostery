feature: 2026-05-17-roostery-smoke
created: 2026-05-17

steps:
  - action: "paths 扩 + 类型骨架 + Cargo.toml + lib.rs：paths::state_dir + paths::smoke_state_path；新建 src/smoke.rs 声明 PROBE_MATRIX (6 条) + ProbeResult + SmokeReport (#[non_exhaustive]) + SmokeError 4 变体 + run/ensure_ready 签名 todo!()；Cargo.toml 加 clap = { version = \"4\", features = [\"derive\"] }；lib.rs pub mod smoke;"
    exit_signal: "cargo build 成功；paths::smoke_state_path 单测 returns ~/.roostery/state/smoke.json；SmokeReport serde round-trip 单测通过；既有 testsuite 无回归"
    status: done

  - action: "probe_one + 10s timeout：实现单条 probe（spawn + stdin null + wait + 简易 timeout（Command + thread + kill 模式或直接同步阻塞 wait）+ classify 'Dry Run' / 'unknown flag' / 其他）；用伪 binary fixture 测 4 case"
    exit_signal: "probe_one 4 单测全过（happy / timeout / unknown flag / non-zero rc）"
    status: done

  - action: "run() 编排 + atomic save：实现 run（resolve binary → fetch lark_cli_version → 顺序跑 6 probe → all_ok → save_report 写 .tmp + rename）+ save_report + load_last；binary not found 时全部 probe 标 ok=false 仍写 state file"
    exit_signal: "用伪 binary fixture 跑整个 run 验证 state file schema 11 字段全到；atomic rename 单测；binary not found 路径 single 测试"
    status: done

  - action: "ensure_ready() + 4 错误路径：实现 gate API；4 单测覆盖 NeverRun / LastFailed / StateLoadFailed / Ok happy"
    exit_signal: "ensure_ready 4 单测全过"
    status: done

  - action: "main.rs 重写 clap + smoke 子命令 + 集成测试：引 clap derive；roostery smoke 子命令；#[command(version = concat!(env!(\"CARGO_PKG_VERSION\"), \" (rust)\"))] 锁定 --version 输出严格保持现状；写 2 集成测试（tests/smoke_integration.rs 用 fixture lark-cli 验 all_ok / 部分失败两条路径）"
    exit_signal: "./target/debug/roostery smoke 跑通；./target/debug/roostery --version 输出严格 == 'roostery 0.0.0 (rust)'；2 集成测试通过；cargo test --all 全绿"
    status: done

  - action: "完整验收 + CI：cargo test --all + cargo test --doc + cargo clippy --all-targets --all-features -- -D warnings + cargo fmt --all --check 四命令全绿；推 CI 验三 job"
    exit_signal: "本地四命令全绿；远端 CI 全绿"
    status: done

