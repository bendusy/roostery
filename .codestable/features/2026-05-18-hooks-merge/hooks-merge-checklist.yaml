created: 2026-05-18

steps:
  - action: "lib.rs + 模板文件 + 类型骨架：lib.rs 加 pub mod hooks_merge;；新建 src/hooks_merge.rs 含 3 个 pub const (include_str! cc_stop_hook.json / codex_stop_hook.json / agent_stop_notify.sh) + HooksError #[non_exhaustive] 4 变体 + 3 fn 签名 todo!()；新建 src/templates/{cc_stop_hook.json,codex_stop_hook.json,agent_stop_notify.sh} 3 个模板文件（env 前缀切到 ROOSTERY_AGENT，sh 调 roostery dispatcher fire）"
    exit_signal: "cargo build 成功；3 个 const 非空字符串单测；既有 testsuite 无回归"
    status: done

  - action: "render_template + 字符串替换：实现 render_template（String::replace + serde_json::from_str）；不引模板引擎"
    exit_signal: "render 4 单测（CC happy / Codex happy / 占位符替换验证 / 模板非法 JSON case）"
    status: done

  - action: "merge_event_hook 核心算法：实现 detect_event_key + load_existing + tail 匹配去重；纯函数行为不做文件 IO"
    exit_signal: "merge 6 单测（空 target / 已有不同 event / 同 event 不同 matcher / 同 matcher 不同 command / 同 command 去重 / fragment invalid 各错误）"
    status: done

  - action: "apply_template + atomic save：实现 apply_template（render + merge + write）；ensure parent dir + fs::write .tmp + fs::rename"
    exit_signal: "apply_template 端到端单测（fixture 路径 + .tmp 不残留 + 写入 JSON byte 一致）"
    status: done

  - action: "集成测试 + JSON 输出格式守护：写 ≥ 1 集成测试 tests/hooks_merge_integration.rs（CC + Codex 都注入；二次 apply 幂等；输出 indent=2 + \\n 结尾断言）"
    exit_signal: "集成测试通过；cargo test --all 全绿"
    status: done

  - action: "完整验收 + CI：cargo test --all + cargo test --doc + cargo clippy --all-targets --all-features -- -D warnings + cargo fmt --all --check 四命令全绿；推 CI 验三 job"
    exit_signal: "本地四命令全绿；远端 CI 全绿"
    status: done

